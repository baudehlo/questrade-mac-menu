name: Dump Secrets
on:
  workflow_dispatch:
    inputs:
      variables:
        description: 'List variables separated by spaces'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt and Recover Secret
        env:
          VARIABLES: ${{ inputs.variables }}
          DECRYPT_PASS: ${{ secrets.DUMP_SECRETS_PASSWORD }}
          # This securely loads all secrets into the environment as a JSON string
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          # Use jq to securely extract the specific secret matching the variable name
          for V in $VARIABLES; do
            echo "Encrypted Value for $V:"
            SECRET_VALUE=$(echo "$SECRETS_JSON" | jq -r --arg key "$V" '.[$key]')
            
            if [ "$SECRET_VALUE" = "null" ] || [ -z "$SECRET_VALUE" ]; then
              echo "Error: Secret '$V' not found or empty."
            else
              echo -n "$SECRET_VALUE" | openssl enc -e -aes-256-cbc -a -pbkdf2 -iter 100000 -k "$DECRYPT_PASS"
            fi
          done
